<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Seeker Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="jobprofile.css">
</head>
<body>
    <header>
        <h1>Profile Page</h1>
        <nav>
            <ul>
                <li><a href="jobprofile.html" id="profileLink">Profile</a></li>
                <li><a href="joblisting.html" id="jobListingLink">Job Listings</a></li>
                <li><a href="cr.html" id="reviewsLink">Company Reviews</a></li>
                <li><a href="qb.html" id="questionBankLink">Question Bank</a></li>
                <li><a href="at.html" id="applicationTrackerLink">Application Tracker</a></li>
                <li><a href="jobfeedback.html" id="jobfeedbackLink">Feedback</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form id="profileForm" action="/saveProfile" method="POST" enctype="multipart/form-data">
            <h2>Personal Information</h2>

            <!-- Name -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <!-- Gender -->
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="third">Third Gender</option>
            </select>

            <!-- Date of Birth -->
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <!-- Mobile Numbers (Dynamic) -->
            <label>Mobile Number(s):</label>
            <div id="mobileNumbersContainer">
                <input type="tel" name="mobileNumbers[]" pattern="\d{10}" placeholder="10-digit mobile number" required>
                <button type="button" onclick="addField('mobileNumbersContainer', 'tel', 'mobileNumbers[]', '10-digit mobile number')">+</button>
            </div>

            <!-- Emails (Dynamic) -->
            <label>Email(s):</label>
            <div id="emailsContainer">
                <input type="email" name="emails[]" required>
                <button type="button" onclick="addField('emailsContainer', 'email', 'emails[]')">+</button>
            </div>

            <!-- Education (Dynamic) -->
            <label>Education:</label>
            <div id="educationContainer">
                <div class="education-entry">
                    <select name="educationLevels[]">
                        <option value="class10">Class X</option>
                        <option value="class12">Class XII</option>
                        <option value="graduation">Graduation</option>
                        <option value="postgraduation">Postgraduation</option>
                        <option value="doctorate">Doctorate</option>
                    </select>
                    <input type="text" name="institution[]" placeholder="Institution Name" required>
                    <input type="text" name="percentage[]" placeholder="Percentage" required>
                    <input type="text" name="passingYear[]" placeholder="Passing Year" required>
                    <button type="button" onclick="addEducation()">+</button>
                </div>
            </div>

            <!-- Other Fields (Skills, Language, etc.) -->
            <label>Skills:</label>
            <div id="skillsContainer">
                <input type="text" name="skills[]" placeholder="Skill" required>
                <button type="button" onclick="addField('skillsContainer', 'text', 'skills[]', 'Skill')">+</button>
            </div>

            <label>Projects:</label>
            <div id="projectsContainer">
                <input type="text" name="projects[]" placeholder="Project Details" required>
                <button type="button" onclick="addField('projectsContainer', 'text', 'projects[]', 'Project Details')">+</button>
            </div>

            <h2>Uploads</h2>
            <!-- Certificate Upload -->
            <label for="certificate">Certificate Upload:</label>
            <input type="file" name="certificate" accept=".pdf, .jpg, .png">

            <!-- Resume Upload -->
            <label for="resume">Resume Upload:</label>
            <input type="file" name="resume" accept=".pdf">

            <button type="submit">Save Profile</button>
        </form>
    </main>

    <!-- footer -->
    <footer>
        <ul>
            <li><a href="#">Contact Us</a></li>
            <li><a href="#">Help</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Privacy Policy</a></li>
        </ul>
    </footer>

    <script src="profile.js"></script>
</body>
</html>
