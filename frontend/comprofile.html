
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Profile</title>
    <link rel="stylesheet" href="comprofile.css">
</head>
<body>
    <header>
        <h1>Company Dashboard</h1>
        <nav>
            <a href="comprofile.html" class="active">Profile</a>
            <a href="jobpost.html">Job Post</a>
            <a href="applications.html">Applications</a>
            <a href="applicationtracker.html">Application Tracker</a>
        </nav>
    </header>
    <main>
        <section id="profile">
            <h2>Company Profile</h2>
            <form id="profileForm">
                <label for="companyName">Company Name:</label>
                <input type="text" id="companyName" name="companyName" required>

                <label for="aboutCompany">About Company:</label>
                <textarea id="aboutCompany" name="aboutCompany" rows="5" required></textarea>

                <button type="submit" id="saveButton">Save</button>
                <button type="button" id="editButton" style="display:none;">Edit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Job Portal</p>
    </footer>
    <script src="comprofile.js"></script>
</body>
</html>
