<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Reviews</title>
    <link rel="stylesheet" href="cr.css">
</head>
<body>
    <header>
        <h1>Company Reviews</h1>
        <nav>
            <ul>
                <li><a href="jobprofile.html" id="profileLink">Profile</a></li>
                <li><a href="joblisting.html" id="jobListingLink">Job Listings</a></li>
                <li><a href="cr.html" id="reviewsLink">Company Reviews</a></li>
                <li><a href="qb.html" id="questionBankLink">Question Bank</a></li>
                <li><a href="at.html" id="applicationTrackerLink">Application Tracker</a></li>
                <li><a href="jobfeedback.html" id="jobfeedbackLink">Feedback</a></li>
            </ul>
        </nav>
    </header>

    <section id="submit-review">
        <h2>Submit a Review</h2>
        <form id="reviewForm">
            <label for="reviewCompany">Company Name:</label>
            <input type="text" id="reviewCompany" placeholder="Company name" required>

            <label for="reviewRating">Rating (1-5):</label>
            <select id="reviewRating" required>
                <option value="">Select</option>
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Good</option>
                <option value="3">3 - Average</option>
                <option value="2">2 - Below Average</option>
                <option value="1">1 - Poor</option>
            </select>

            <label for="reviewReason">Comments:</label>
            <textarea id="reviewReason" rows="3" placeholder="Share your experience..."></textarea>

            <button type="submit">Submit Review</button>
        </form>
    </section>

    <section id="reviews-section">
        <h2>All Company Reviews</h2>
        <table id="reviewTable">
            <thead>
                <tr>
                    <th>Company Name</th>
                    <th>Rating</th>
                    <th>Comments</th>
                </tr>
            </thead>
            <tbody>
                <!-- Reviews will be dynamically loaded here -->
            </tbody>
        </table>
    </section>

    <script src="cr.js"></script>
</body>
</html>
