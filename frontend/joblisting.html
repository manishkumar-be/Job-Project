<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Listings</title>
    <link rel="stylesheet" href="joblisting.css">
</head>
<body>
    <header>
        <h1>Job Listings</h1>
        <nav>
            <ul>
                <li><a href="jobprofile.html" id="profileLink">Profile</a></li>
                <li><a href="joblisting.html" id="jobListingLink">Job Listings</a></li>
                <li><a href="cr.html" id="reviewsLink">Company Reviews</a></li>
                <li><a href="qb.html" id="questionBankLink">Question Bank</a></li>
                <li><a href="at.html" id="applicationTrackerLink">Application Tracker</a></li>
                <li><a href="jobfeedback.html" id="jobfeedbackLink">Feedback</a></li>
            </ul>
        </nav>
    </header>

    <!-- Search Box -->
    <section id="search-box">
        <h2>Find Your Job</h2>
        <form id="search-form">
            <input type="text" id="company-name" placeholder="Company Name">
            <input type="text" id="location" placeholder="Location">
            <input type="number" id="min-salary" placeholder="Min Salary">
            <input type="number" id="max-salary" placeholder="Max Salary">
            <input type="text" id="company-type" placeholder="Company type (e.g. IT)">
            <input type="text" id="work-type" placeholder="Work type (Online/offline/hybrid)">

            <!-- <button type="button" onclick="filterJobs()">Search</button> -->
            <button type="button" onclick="filterJobs()">Search</button>
        </form>
    </section>

    <!-- Job Listings -->
    <section id="job-listings">
        <h2>Available Jobs</h2>
        <div id="job-list">
            <!-- Job posts will be displayed here by JavaScript -->
        </div>
    </section> 

    <!-- Modal for Job Application -->
    <div id="apply-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Apply for Job</h2>
            <form id="application-form">
                <input type="hidden" id="job-id">
                <label for="applicant-name">Name:</label>
                <input type="text" id="applicant-name" placeholder="Your Name" required>
                <label for="applicant-phone">Mobile Number:</label>
                <input type="tel" id="applicant-phone" placeholder="Your Mobile Number" required>
                <label for="applicant-email">Email:</label>
                <input type="email" id="applicant-email" placeholder="Your Email" required>
                <label for="applicant-resume">Upload Resume:</label>
                <input type="file" id="applicant-resume" required>
                <button type="button" onclick="submitApplication()">Submit</button>
            </form>
        </div>
    </div>

    <footer>
        <ul>
            <li><a href="#">Contact Us</a></li>
            <li><a href="#">Help</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Privacy Policy</a></li>
        </ul>
    </footer>

    <script src="joblisting.js"></script>
</body>
</html>
