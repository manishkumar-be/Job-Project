<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Post</title>
    <link rel="stylesheet" href="jobpost.css">
</head>
<body>
    <header>
        <h1>Company Dashboard</h1>
        <nav>
            <a href="comprofile.html">Profile</a>
            <a href="jobpost.html" class="active">Job Post</a>
            <a href="applications.html">Applications</a>
            <a href="applicationtracker.html">Application Tracker</a>
        </nav>
    </header>
    <main>
        <section id="jobPostFormSection">
            <h2>Create Job Post</h2>
            <form id="jobPostForm">
                <label for="postName">Post Name:</label>
                <input type="text" id="postName" name="postName" required>

                <label for="companyName">Company Name:</label>
                <input type="text" id="companyName" name="companyName" required>

                <label for="location">Location:</label>
                <input type="text" id="location" name="location" required>

                <label for="salary">Salary:</label>
                <input type="number" id="salary" name="salary" required>

                <label for="companyType">Company Type:</label>
                <input type="companyType" id="companyType" name="companyType" required>

                <!-- <label for="companyType">Company Type:</label>
                <select id="companyType" name="companyType" required>
                    <option value="">Select</option>
                    <option value="IT">IT</option>
                    <option value="Finance">Finance</option>
                    <option value="Education">Education</option>
                    <option value="Healthcare">Healthcare</option>
                </select> -->

                <label for="workType">Work Type:</label>
                <select id="workType" name="workType" required>
                    <option value="">Select</option>
                    <option value="Online">Online</option>
                    <option value="offline">offline</option>
                    <option value="hybrid">hybrid</option>
                </select>

                <button type="submit">Create Job Post</button>
            </form>
        </section>

        <section id="jobPostsSection">
            <h2>Existing Job Posts</h2>
            <table id="jobPostsTable">
                <thead>
                    <tr>
                        <th>Post Name</th>
                        <th>Company Name</th>
                        <th>Location</th>
                        <th>Salary</th>
                        <th>Company Type</th>
                        <th>Work Type</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Job posts will be dynamically added here -->
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Job Portal</p>
    </footer>
    <script src="jobpost1.js"></script>
</body>
</html>
