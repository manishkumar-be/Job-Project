<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/jobprofile.css">
</head>
<body data-role="jobSeeker">
    <header>
        <h1>Profile Page</h1>
        <nav id="mainNav"></nav>
    </header>

    <main>
        <p id="formMessage" class="message" hidden></p>

        <section id="profileSummary" class="card profile-summary" hidden></section>

        <form id="profileForm" enctype="multipart/form-data">
            <h2 id="formTitle">Create Your Profile</h2>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="third">Third Gender</option>
            </select>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label>Mobile Number(s):</label>
            <div id="mobileNumbersContainer"></div>
            <button type="button" class="add-btn" data-list="mobileNumbers">+ Add mobile number</button>

            <label>Email(s):</label>
            <div id="emailsContainer"></div>
            <button type="button" class="add-btn" data-list="emails">+ Add email</button>

            <label>Education:</label>
            <div id="educationContainer"></div>
            <button type="button" id="addEducationBtn">+ Add education</button>

            <label>Skills:</label>
            <div id="skillsContainer"></div>
            <button type="button" class="add-btn" data-list="skills">+ Add skill</button>

            <label>Projects:</label>
            <div id="projectsContainer"></div>
            <button type="button" class="add-btn" data-list="projects">+ Add project</button>

            <h2>Uploads</h2>
            <label for="certificate">Certificate (PDF, JPG or PNG, max 5 MB):</label>
            <p id="currentCertificate"></p>
            <input type="file" id="certificate" name="certificate" accept=".pdf,.jpg,.jpeg,.png">

            <label for="resume">Resume (PDF, DOC or DOCX, max 5 MB):</label>
            <p id="currentResume"></p>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">

            <button type="submit" id="saveProfileBtn">Save Profile</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 Job Portal</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/jobprofile.js"></script>
</body>
</html>
