<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Post</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/jobpost.css">
</head>
<body data-role="company">
    <header>
        <h1>Company Dashboard</h1>
        <nav id="mainNav"></nav>
    </header>

    <main>
        <section id="jobPostFormSection">
            <h2 id="jobFormTitle">Create Job Post</h2>
            <p>Posting as <strong data-company-name></strong></p>
            <form id="jobPostForm">
                <input type="hidden" id="editingId">

                <label for="postName">Post Name:</label>
                <input type="text" id="postName" name="postName" required>

                <label for="location">Location:</label>
                <input type="text" id="location" name="location" required>

                <label for="salary">Salary:</label>
                <input type="number" id="salary" name="salary" min="0" required>

                <label for="companyType">Company Type:</label>
                <input type="text" id="companyType" name="companyType" placeholder="e.g. IT, Finance" required>

                <label for="workType">Work Type:</label>
                <select id="workType" name="workType" required>
                    <option value="">Select</option>
                    <option value="Online">Online</option>
                    <option value="Offline">Offline</option>
                    <option value="Hybrid">Hybrid</option>
                </select>

                <button type="submit" id="jobSubmitBtn">Create Job Post</button>
                <button type="button" id="cancelEditBtn" hidden>Cancel Edit</button>
                <p id="formMessage" class="message" hidden></p>
            </form>
        </section>

        <section id="jobPostsSection">
            <h2>Your Job Posts</h2>
            <table id="jobPostsTable">
                <thead>
                    <tr>
                        <th>Post Name</th>
                        <th>Location</th>
                        <th>Salary</th>
                        <th>Company Type</th>
                        <th>Work Type</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Job Portal</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/jobpost.js"></script>
</body>
</html>
