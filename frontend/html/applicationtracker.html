<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Tracker</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/applicationtracker.css">
</head>
<body data-role="company">
    <header>
        <h1>Company Dashboard</h1>
        <nav id="mainNav"></nav>
    </header>

    <main>
        <section id="trackedSection">
            <h2>Application Tracker</h2>
            <table id="trackerTable">
                <thead>
                    <tr>
                        <th>Applicant Name</th>
                        <th>Email</th>
                        <th>Job Post</th>
                        <th>Applied On</th>
                        <th>Current Status</th>
                        <th>Update Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Job Portal</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/applicationtracker.js"></script>
</body>
</html>
