<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Help</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/jobfeedback.css">
</head>
<body data-role="jobSeeker">
    <header>
        <h1>Get Help</h1>
        <nav id="mainNav"></nav>
    </header>

    <main>
        <section>
            <h2>Ask for Help</h2>
            <p>Describe your problem and an administrator will look into it.</p>
            <form id="helpForm">
                <label>Your Email:</label>
                <p data-user-email></p>

                <label for="helpIssue">Issue:</label>
                <textarea id="helpIssue" rows="5" required></textarea>

                <button type="submit">Send Request</button>
                <p id="formMessage" class="message" hidden></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Job Portal</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/jobhelp.js"></script>
</body>
</html>
