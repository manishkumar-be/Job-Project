<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Tracker</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/at.css">
</head>
<body data-role="jobSeeker">
    <header>
        <h1>Your Job Application Tracker</h1>
        <nav id="mainNav"></nav>
    </header>

    <section class="application-status">
        <h2>Track Your Applications</h2>
        <table id="application-table">
            <thead>
                <tr>
                    <th>Job Title</th>
                    <th>Company</th>
                    <th>Applied On</th>
                    <th>Resume</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr class="empty-row"><td colspan="5">Loading...</td></tr>
            </tbody>
        </table>
    </section>

    <footer>
        <p>&copy; 2024 Job Portal</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/at.js"></script>
</body>
</html>
