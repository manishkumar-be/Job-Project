<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal Registration</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <h2>Job Portal Registration</h2>
    <form id="registerForm">
        <label for="registerType">Register As:</label>
        <select id="registerType" name="registerType" required>
            <option value="">Select</option>
            <option value="jobSeeker">Job Seeker</option>
            <option value="company">Company</option>
        </select>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" autocomplete="username" required>

        <label for="password">Password (at least 6 characters):</label>
        <input type="password" id="password" name="password" minlength="6" autocomplete="new-password" required>

        <div id="companyField" style="display: none;">
            <label for="companyName">Company Name:</label>
            <input type="text" id="companyName" name="companyName">
        </div>

        <button type="submit">Register</button>
        <p id="formMessage" class="message" hidden></p>
    </form>

    <p>Already registered? <a href="login.html">Log in here</a></p>

    <script src="../js/api.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
