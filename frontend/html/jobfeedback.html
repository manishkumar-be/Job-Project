<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/jobfeedback.css">
</head>
<body data-role="jobSeeker">
    <header>
        <h1>Job Portal Feedback</h1>
        <nav id="mainNav"></nav>
    </header>

    <main>
        <section>
            <h2>Share Your Feedback</h2>
            <form id="feedbackForm">
                <label>Your Email:</label>
                <p data-user-email></p>

                <label for="feedbackMessage">Your Feedback:</label>
                <textarea id="feedbackMessage" name="feedbackMessage" rows="5" required></textarea>

                <button type="submit">Submit Feedback</button>
                <p id="formMessage" class="message" hidden></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Job Portal</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/jobfeedback.js"></script>
</body>
</html>
